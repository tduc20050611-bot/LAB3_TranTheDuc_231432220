<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giám sát vườn trồng</title>
<style>
:root{color-scheme:light;--ink:#152e29;--soft:#516861;--line:#d8e5de;--accent:#136455;--page:#edf4ee}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{width:min(1050px,calc(100% - 36px));margin:48px auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#153a31;color:#fff;border-radius:22px;padding:28px 32px;margin-bottom:20px}
header p{margin:0;color:#c4dfd3}
.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:700}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;margin:5px 0}
.badge{border:1px solid #80aa97;border-radius:99px;padding:9px 14px;text-align:center;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
h2{font-size:17px;margin:0}
.metric{font-size:clamp(34px,6vw,54px);font-weight:720;margin:7px 0 10px;letter-spacing:-.05em}
.metric small{color:var(--soft);font-size:16px;letter-spacing:0}
canvas{width:100%;height:154px;display:block}
.subline,footer{font-size:13px;color:var(--soft);line-height:1.5}
.controls{margin-top:16px}
.devices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.devices>div{background:#f3f8f5;border-radius:12px;padding:14px}
h3{margin:0;font-size:15px}
.devices p{color:var(--soft);font-size:13px;margin:5px 0 12px}
button{border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;padding:9px 13px;font:inherit;font-size:14px;font-weight:650;cursor:pointer}
button[aria-pressed=true]{background:#fff;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid #d38b22;outline-offset:3px}
footer{margin-top:14px;overflow-wrap:anywhere}
@media(max-width:640px){main{margin:18px auto}header{align-items:flex-start;flex-direction:column;padding:19px}.grid,.devices{grid-template-columns:1fr}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>

</head>
<body>
<main>
<header>
<div><p class="eyebrow">LAB 3 / ĐỀ 2</p><h1>Giám sát vườn trồng</h1><p>Cà phê và hồ tiêu · ESP32 / DHT22</p></div>
<div id="connection" class="badge" role="status">Đang kết nối MQTT…</div>
</header>
<section class="grid" aria-label="Dữ liệu môi trường">
<article class="card"><h2>Nhiệt độ</h2><p class="metric"><span class="measurement" id="temperature">—</span> <small>°C</small></p><canvas id="tempChart" aria-label="Biểu đồ nhiệt độ"></canvas></article>
<article class="card"><h2>Độ ẩm không khí</h2><p class="metric"><span class="measurement" id="humidity">—</span> <small>%RH</small></p><canvas id="humChart" aria-label="Biểu đồ độ ẩm"></canvas></article>
</section>
<p class="subline" id="sampleStatus">Đang chờ mẫu từ ESP32.</p>
<section class="card controls">
<h2>Điều khiển thiết bị</h2>
<div class="devices">
<div><h3>Máy bơm</h3><p>Manual</p><button id="pump" disabled>Bật bơm</button></div>
<div><h3>Quạt</h3><p>Manual</p><button id="fan" disabled>Bật quạt</button></div>
<div><h3>Phun sương</h3><p>Tự động · Mục tiêu 40–60% RH</p><strong id="mist">—</strong></div>
</div>
<p class="subline" id="commandStatus" role="status">Chờ ESP32 gửi trạng thái thiết bị.</p>
</section>
<footer>MQTT · <code id="namespace"></code></footer>
</main>
<script>
window.addEventListener("DOMContentLoaded", () => {
'use strict';
const root = 'lab3/de2/vuon-dht22-5c8f14';
const byId = id => document.getElementById(id);
const series = [];
let device = null, deviceSeen = 0, sampleSeen = 0;
const pending = new Map();
byId('namespace').textContent = root;

function draw(id, key, color) {
  const canvas = byId(id);
  const width = canvas.clientWidth, height = canvas.clientHeight;
  const scale = window.devicePixelRatio || 1;
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.font = '11px system-ui';
  const x0 = 32, x1 = width - 12, y0 = 10, y1 = height - 25;
  const values = series.map(row => row[key]);
  const low = values.length ? Math.floor(Math.min(...values) - 2) : 0;
  const high = values.length ? Math.ceil(Math.max(...values) + 2) : 100;
  for (let i = 0; i < 5; i++) {
    const y = y0 + i * (y1 - y0) / 4;
    ctx.strokeStyle = '#d8e5de';
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillStyle = '#516861';
    ctx.fillText((high - i * (high - low) / 4).toFixed(0), 0, y + 4);
  }
  if (!values.length) {
    ctx.textAlign = 'center';
    ctx.fillText('Chờ dữ liệu từ ESP32', (x0 + x1) / 2, (y0 + y1) / 2);
    return;
  }
  const from = series[0].time, to = series.at(-1).time;
  const xAt = i => x0 + (series[i].time - from) / Math.max(1, to - from) * (x1 - x0);
  const yAt = value => y1 - (value - low) / (high - low) * (y1 - y0);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  values.forEach((value, i) => i ? ctx.lineTo(xAt(i), yAt(value)) : ctx.moveTo(xAt(i), yAt(value)));
  ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath();
  ctx.arc(xAt(values.length - 1), yAt(values.at(-1)), 3.5, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#516861';
  ctx.fillText(new Date(from).toLocaleTimeString('vi-VN'), x0, height - 6);
  if (to > from && x1 - x0 > 120) {
    ctx.textAlign = 'right';
    ctx.fillText(new Date(to).toLocaleTimeString('vi-VN'), x1, height - 6);
  }
}
function drawCharts() {
  draw('tempChart', 'temperature', '#ac552a');
  draw('humChart', 'humidity', '#167970');
}
window.addEventListener('resize', drawCharts);
drawCharts();

const client = window.mqtt?.connect('wss://broker.hivemq.com:8884/mqtt', {
  reconnectPeriod: 3000, connectTimeout: 8000, clean: true, keepalive: 20, queueQoSZero: false
});
function renderOutputs() {
  const live = !!client?.connected && device && Date.now() - deviceSeen < 8200;
  for (const [key, label] of [['pump', 'bơm'], ['fan', 'quạt']]) {
    const button = byId(key);
    const on = live && device[key] === 1;
    button.textContent = pending.has(key) ? 'Đang gửi…' : live ? (on ? 'Tắt ' : 'Bật ') + label : '—';
    button.setAttribute('aria-pressed', String(!!on));
    button.disabled = !live || pending.has(key);
  }
  byId('mist').textContent = live ? device.mist + '% PWM' : '—';
}
function clearDevice(message) {
  device = null;
  pending.clear();
  renderOutputs();
  byId('commandStatus').textContent = message;
}
function receive(topic, payload) {
  const kind = topic.slice(root.length + 1);
  if (kind === 'availability') {
    if (payload.toString() === 'offline') clearDevice('ESP32 đã ngắt kết nối.');
    return;
  }
  let data;
  try { data = JSON.parse(payload.toString()); } catch { return; }
  if (!data || typeof data !== 'object') return;
  const now = Date.now();
  if (kind === 'telemetry') {
    sampleSeen = now;
    const valid = data.valid === true && Number.isFinite(data.temperature) &&
      Number.isFinite(data.humidity) && data.humidity >= 0 && data.humidity <= 100;
    for (const key of ['temperature', 'humidity']) byId(key).textContent = valid ? data[key].toFixed(1) : '—';
    if (valid) {
      series.push({time: now, temperature: data.temperature, humidity: data.humidity});
      if (series.length > 40) series.shift();
      drawCharts();
    }
    byId('sampleStatus').textContent = valid ? 'Cập nhật ' + new Date(now).toLocaleTimeString('vi-VN') :
      'ESP32 báo lỗi đọc DHT22.';
  }
  if (kind === 'state' && [0, 1].includes(data.pump) && [0, 1].includes(data.fan) &&
      [0, 25, 50, 100].includes(data.mist)) {
    if (!device) byId('commandStatus').textContent = 'Đã nhận trạng thái từ ESP32.';
    device = data;
    deviceSeen = now;
    for (const [key, command] of pending) {
      if (data[key] === command.desired) {
        pending.delete(key);
        byId('commandStatus').textContent = 'ESP32 đã phản hồi trạng thái mới.';
      }
    }
    renderOutputs();
  }
}
if (client) {
  client.on('connect', () => {
    client.subscribe(['telemetry', 'state', 'availability'].map(name => root + '/' + name), error => {
      byId('connection').textContent = error ? 'Lỗi đăng ký MQTT' : 'MQTT đã kết nối';
    });
  });
  client.on('message', receive);
  client.on('close', () => {
    byId('connection').textContent = 'MQTT mất kết nối · đang thử lại';
    clearDevice('Chờ kết nối lại.');
  });
  client.on('error', () => { byId('connection').textContent = 'Lỗi kết nối MQTT'; });
} else {
  byId('connection').textContent = 'Không tải được thư viện MQTT';
}
for (const key of ['pump', 'fan']) {
  byId(key).addEventListener('click', () => {
    if (!client?.connected || !device || Date.now() - deviceSeen >= 8200 || pending.has(key)) return;
    const desired = 1 - device[key];
    pending.set(key, {desired, deadline: Date.now() + 5000});
    byId('commandStatus').textContent = 'Đang chờ ESP32 xác nhận…';
    renderOutputs();
    client.publish(root + '/cmd/' + key, String(desired), {qos: 0, retain: false}, error => {
      if (error) {
        pending.delete(key);
        byId('commandStatus').textContent = 'Gửi lệnh thất bại.';
        renderOutputs();
      }
    });
  });
}
setInterval(() => {
  const now = Date.now();
  if (device && now - deviceSeen >= 8200) clearDevice('Đã quá thời gian chờ trạng thái ESP32.');
  for (const [key, command] of pending) {
    if (now >= command.deadline) {
      pending.delete(key);
      byId('commandStatus').textContent = 'Chưa nhận xác nhận từ ESP32.';
      renderOutputs();
    }
  }
  if (sampleSeen && now - sampleSeen >= 8200) {
    for (const key of ['temperature', 'humidity']) byId(key).textContent = '—';
    byId('sampleStatus').textContent = 'Mẫu cảm biến quá hạn.';
    sampleSeen = 0;
  }
}, 500);

});
</script>
</body>
</html>
